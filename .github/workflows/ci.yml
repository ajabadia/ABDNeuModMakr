name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    name: typecheck · tests · security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Typecheck (src + tests + vendor)
        run: npm run test:types

      - name: Security grep gate (S2.1)
        run: npm run lint:security

      - name: Test suites
        run: npm test

      - name: Production build
        run: npm run build
